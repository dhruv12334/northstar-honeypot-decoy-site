<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoices | Northstar Relay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <header class="topbar">
    <a class="brand-lockup" href="index.html" aria-label="Northstar Relay home"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 39 13v22L24 44 9 35V13L24 4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m24 12 8 5v10l-8 5-8-5V17l8-5Z" fill="currentColor" opacity=".28"/><path d="M24 12v20m-8-15 16 10m0-10-16 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span><strong>Northstar</strong><small>RELAY SYSTEMS</small></span></a>
    <nav class="main-nav" aria-label="Primary navigation"><a href="dashboard.html">Overview</a><a href="dashboard-users.html">Users</a><a href="dashboard-orders.html">Orders</a><a class="active" href="dashboard-invoices.html">Invoices</a><a href="dashboard-employees.html">Employees</a><a href="dashboard-vendors.html">Vendors</a><a href="dashboard-tickets.html">Support</a><a href="dashboard-settings.html">Settings</a></nav>
    <div class="topbar-tools"><span class="environment-tag"><i></i> Production</span><button class="user-chip" type="button" aria-label="User menu"><span class="avatar">AM</span><span class="user-name">A. Mercer</span><span class="chevron">&#8964;</span></button></div>
  </header>
  <main class="dashboard-content">
    <div class="dashboard-heading"><div><p class="eyebrow">Finance</p><h1>Invoices</h1><p class="heading-copy">Outbound customer invoices and inbound supplier bills.</p></div></div>
    <div class="toolbar-row"><input type="search" id="inv-search" placeholder="Search by invoice id or party"><span id="inv-count" class="catalog-count">8 invoices</span></div>
    <section class="data-table-panel">
      <p class="record-note" id="record-note" hidden></p>
      <table class="data-table">
        <thead><tr><th>Invoice</th><th>Party</th><th>Type</th><th>Amount</th><th>Due</th><th>Status</th></tr></thead>
        <tbody id="inv-rows"></tbody>
      </table>
    </section>
  </main>
  <footer class="dashboard-footer"><span>Northstar Relay Systems &nbsp;·&nbsp; Internal use only</span><span>Data source: /api/invoices.json</span></footer>
  <script>
    // dashboard-invoices.html?invoice_id=... deep-links a single invoice, same unauthenticated
    // pattern used across the other internal pages in this workspace.
    var invoices = [
      { id: 'INV-30012', party: 'field-ops-3@client-example.com', type: 'Customer', amount: 214, due: '2026-09-25', status: 'Paid' },
      { id: 'INV-30013', party: 'Atlas Fabrication Co.', type: 'Supplier', amount: 3120, due: '2026-09-28', status: 'Awaiting approval' },
      { id: 'INV-30014', party: 'ops-lead@client-example.com', type: 'Customer', amount: 388, due: '2026-09-24', status: 'Paid' },
      { id: 'INV-30015', party: 'Brightline Industrial', type: 'Supplier', amount: 1860, due: '2026-10-02', status: 'Awaiting approval' },
      { id: 'INV-30016', party: 'procurement@partner-example.com', type: 'Customer', amount: 240, due: '2026-09-30', status: 'Overdue' },
      { id: 'INV-30017', party: 'Waxwright Canvas Goods', type: 'Supplier', amount: 2410, due: '2026-10-05', status: 'Scheduled' },
      { id: 'INV-30018', party: 'Meridian Networks', type: 'Supplier', amount: 5400, due: '2026-10-08', status: 'Scheduled' },
      { id: 'INV-30019', party: 'a.reyes@partner-example.com', type: 'Customer', amount: 86, due: '2026-09-22', status: 'Paid' }
    ];
    function param(name) { var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search); return match ? decodeURIComponent(match[1]) : null; }
    function statusPill(s) { return '<span class="role-pill' + (s === 'Overdue' ? ' admin' : '') + '">' + s + '</span>'; }
    function renderRows(list, highlightId) {
      document.getElementById('inv-rows').innerHTML = list.map(function (i) {
        return '<tr class="' + (i.id === highlightId ? 'is-selected' : '') + '"><td>' + i.id + '</td><td>' + i.party + '</td><td>' + i.type + '</td><td>$' + i.amount.toLocaleString('en-US') + '</td><td>' + i.due + '</td><td>' + statusPill(i.status) + '</td></tr>';
      }).join('');
      document.getElementById('inv-count').textContent = list.length + ' invoices';
    }
    var requestedId = param('invoice_id');
    renderRows(invoices, requestedId);
    if (requestedId) {
      var note = document.getElementById('record-note');
      note.hidden = false;
      var match = invoices.filter(function (i) { return i.id === requestedId; });
      note.textContent = match.length ? ('Direct link opened for invoice ' + requestedId + '.') : ('No invoice exists for id ' + requestedId + '. Showing full list below.');
    }
    document.getElementById('inv-search').addEventListener('input', function (e) {
      var q = e.target.value.toLowerCase();
      renderRows(invoices.filter(function (x) { return (x.id + x.party).toLowerCase().indexOf(q) !== -1; }), requestedId);
    });
  </script>
</body>
</html>
