<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Accounts | Northstar Relay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
  <header class="topbar">
    <a class="brand-lockup" href="index.html" aria-label="Northstar Relay home"><svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 39 13v22L24 44 9 35V13L24 4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m24 12 8 5v10l-8 5-8-5V17l8-5Z" fill="currentColor" opacity=".28"/><path d="M24 12v20m-8-15 16 10m0-10-16 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span><strong>Northstar</strong><small>RELAY SYSTEMS</small></span></a>
    <nav class="main-nav" aria-label="Primary navigation"><a href="dashboard.html">Overview</a><a class="active" href="dashboard-users.html">Users</a><a href="dashboard-orders.html">Orders</a><a href="dashboard-invoices.html">Invoices</a><a href="dashboard-employees.html">Employees</a><a href="dashboard-vendors.html">Vendors</a><a href="dashboard-tickets.html">Support</a><a href="dashboard-settings.html">Settings</a></nav>
    <div class="topbar-tools"><span class="environment-tag"><i></i> Production</span><button class="user-chip" type="button" aria-label="User menu"><span class="avatar">AM</span><span class="user-name">A. Mercer</span><span class="chevron">&#8964;</span></button></div>
  </header>
  <main class="dashboard-content">
    <div class="dashboard-heading"><div><p class="eyebrow">Identity Bridge</p><h1>User accounts</h1><p class="heading-copy">Staff and service accounts provisioned on the Relay environment.</p></div></div>
    <div class="toolbar-row"><input type="search" id="user-search" placeholder="Search by name, email, or role"><span id="user-count" class="catalog-count">6 accounts</span></div>
    <section class="data-table-panel">
      <p class="record-note" id="record-note" hidden></p>
      <table class="data-table">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Last login</th><th>Status</th></tr></thead>
        <tbody id="user-rows"></tbody>
      </table>
    </section>
  </main>
  <footer class="dashboard-footer"><span>Northstar Relay Systems &nbsp;·&nbsp; Internal use only</span><span id="viewer-note"></span></footer>
  <script>
    // Static account listing for the demo environment. Each row is addressable directly via
    // ?user_id=N in the URL (used by the support team to deep-link into a specific account).
    var users = [
      { id: 1, name: 'Alex Mercer', email: 'a.mercer@northstar.local', role: 'admin', login: '09:37 today', status: 'Active' },
      { id: 2, name: 'Jin Park', email: 'j.park@northstar.local', role: 'operator', login: '09:12 today', status: 'Active' },
      { id: 3, name: 'Maya Chen', email: 'm.chen@northstar.local', role: 'responder', login: 'Yesterday', status: 'Active' },
      { id: 4, name: 'Sofia Reyes', email: 's.reyes@northstar.local', role: 'operator', login: '3 days ago', status: 'Active' },
      { id: 5, name: 'automation-archive', email: 'automation+archive@northstar.local', role: 'service account', login: 'Continuous', status: 'Active' },
      { id: 6, name: 'D. Whitfield', email: 'd.whitfield@northstar.local', role: 'admin', login: '41 days ago', status: 'Disabled' }
    ];
    function param(name) { var match = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search); return match ? decodeURIComponent(match[1]) : null; }
    function rolePill(role) { return '<span class="role-pill' + (role.indexOf('admin') !== -1 ? ' admin' : '') + '">' + role + '</span>'; }
    function renderRows(list, highlightId) {
      document.getElementById('user-rows').innerHTML = list.map(function (u) {
        return '<tr class="' + (String(u.id) === String(highlightId) ? 'is-selected' : '') + '"><td>' + u.id + '</td><td>' + u.name + '</td><td>' + u.email + '</td><td>' + rolePill(u.role) + '</td><td>' + u.login + '</td><td>' + u.status + '</td></tr>';
      }).join('');
      document.getElementById('user-count').textContent = list.length + ' accounts';
    }
    var requestedId = param('user_id');
    renderRows(users, requestedId);
    if (requestedId) {
      var match = users.filter(function (u) { return String(u.id) === String(requestedId); });
      var note = document.getElementById('record-note');
      note.hidden = false;
      note.textContent = match.length ? ('Filtered view requested for account id ' + requestedId + ' (' + match[0].name + '). Showing full roster below for context.') : ('No account exists for id ' + requestedId + '. Showing full roster below.');
    }
    document.getElementById('user-search').addEventListener('input', function (e) {
      var q = e.target.value.toLowerCase();
      renderRows(users.filter(function (u) { return (u.name + u.email + u.role).toLowerCase().indexOf(q) !== -1; }), requestedId);
    });
    document.getElementById('viewer-note').textContent = 'Signed in as A. Mercer (admin) · session not actually validated in this environment';
  </script>
</body>
</html>
